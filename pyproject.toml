[project]
name = "empregadados-projeto-formula1"
version = "0.1.0"
description = "Aplicação analítica e dashboard interativo de Fórmula 1 consumindo a OpenF1 API"
authors = [
    {name = "leroma-dev"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.5.0"
pytest = ">=8.2.0"
pytest-cov = ">=5.0.0"
pytest-mock = ">=3.14.0"
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
taskipy = ">=1.12.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.taskipy.tasks]
lint = "ruff check . && ruff format --check ."
format = "ruff check . --fix && ruff format ."
test = "pytest --cov=src --cov-report=term-missing --cov-fail-under=50"
docs = "mkdocs serve"
docs_build = "mkdocs build --strict"
run = "streamlit run src/app.py"

